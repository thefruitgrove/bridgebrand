name: BRIDGE stage03-04 isolated QA
on:
  push:
    branches: ['release/bridge-stage03-04-20261115']
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS and static smoke
        run: |
          node --check site/briefing.js
          node tests/test_briefing_stage0304.js
      - name: Python regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Scoring and UNI regressions
        run: |
          python engine3/test_scoring_v3.py
          python tests/test_uni_v43.py
