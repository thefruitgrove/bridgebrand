name: One-time PUBLICITY recovery 2026-11-04

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicity-recovery-20261104.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Asia/Seoul
      SUPABASE_URL: https://gorlbfqvyxtdsxgoqinf.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contract tests
        run: python -m unittest discover -s tests -p test_publicity.py -v
      - name: Backfill missing Wednesday edition
        run: python -m publicity.generate --date 2026-11-04
