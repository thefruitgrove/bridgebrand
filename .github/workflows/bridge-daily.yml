name: BRIDGE Daily Pipeline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bridge-daily.yml'
      - 'bridge_pipeline/**'
      - 'engine3/uni_v43.py'
      - 'uni_builder_v43.py'
      - 'jobs/run_uni_0515.py'
      - 'collectors/collect_uni_*_v43.py'
      - 'config/uni_sources.json'
      - 'automation/**'
      - 'real_data/**'
      - 'build.py'
      - 'build_pilot.py'
      - 'site/**'
  schedule:
    - cron: "15 20 * * *" # 매일 05:15 KST
    - cron: "45 21 * * *" # 06:45 KST 복구 실행: 지연·일시 장애 대비
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "KST date YYYY-MM-DD; blank means today"
        required: false
        type: string

concurrency:
  group: bridge-daily-production
  # A scoring run writes several related tables. Cancelling halfway can leave
  # a mixed public snapshot, so a newer trigger waits for the active run.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-validate-export:
    # The bot's generated-data commit should deploy through Cloudflare but must
    # not start a second collection run.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[bridge-data]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul
      SUPABASE_URL: https://gorlbfqvyxtdsxgoqinf.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      AS_OF_DATE: ${{ inputs.as_of_date }}
      CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fix one Seoul observation date for the entire run
        run: |
          if [ -z "$AS_OF_DATE" ]; then
            RUN_DATE=$(python -c "from bridge_pipeline.core import publication_date; print(publication_date())")
            echo "AS_OF_DATE=$RUN_DATE" >> "$GITHUB_ENV"
          fi

      - name: Install UNI official-data dependencies
        run: pip install pandas openpyxl

      - name: Unit and regression tests
        run: |
          python -m unittest discover -s tests -v
          python engine3/test_scoring_v3.py
          python tests/test_uni_v43.py

      - name: Synchronize active target registry
        run: |
          python -m bridge_pipeline.run bootstrap
          python -m bridge_pipeline.run audit-targets

      - name: Build UNI official baseline and daily observation layer
        run: |
          python uni_builder_v43.py
          python collectors/collect_uni_homepages_v43.py
          python collectors/collect_uni_news_v43.py
          python jobs/run_uni_0515.py

      - name: Collect daily evidence
        run: |
          python -m bridge_pipeline.run discover ${AS_OF_DATE:+--date "$AS_OF_DATE"}
          python -m bridge_pipeline.run collect-news ${AS_OF_DATE:+--date "$AS_OF_DATE"}

      - name: Refresh institutional channel ownership links
        run: python -m bridge_pipeline.verify_gov_channels

      - name: Collect verified GOV public-communication signals
        if: ${{ env.YOUTUBE_API_KEY != '' }}
        run: python -m bridge_pipeline.gov_youtube ${AS_OF_DATE:+--date "$AS_OF_DATE"}

      - name: Refresh DART entity map
        run: python collectors/corp_code_mapper.py

      - name: Collect regulatory evidence
        run: python -m bridge_pipeline.run collect-dart ${AS_OF_DATE:+--date "$AS_OF_DATE"}

      - name: Normalize and import official baselines
        run: |
          python -m bridge_pipeline.ent_interest --date "${AS_OF_DATE:-$(date +%F)}" --output /tmp/ent_axes.csv
          python -m bridge_pipeline.run import-official --file /tmp/ent_axes.csv ${AS_OF_DATE:+--date "$AS_OF_DATE"}
          python -m bridge_pipeline.cpr_financials --output /tmp/cpr_axes.csv
          python -m bridge_pipeline.run import-official --file /tmp/cpr_axes.csv ${AS_OF_DATE:+--date "$AS_OF_DATE"}
          if [ "$(wc -l < automation/uni_baseline_input.csv)" -gt 1 ]; then
            python -m bridge_pipeline.baseline --domain UNI --input automation/uni_baseline_input.csv --output /tmp/uni_axes.csv
            python -m bridge_pipeline.run import-official --file /tmp/uni_axes.csv ${AS_OF_DATE:+--date "$AS_OF_DATE"}
          fi
          if [ "$(wc -l < automation/gov_baseline_input.csv)" -gt 1 ]; then
            python -m bridge_pipeline.baseline --domain GOV --input automation/gov_baseline_input.csv --output /tmp/gov_axes.csv
            python -m bridge_pipeline.run import-official --file /tmp/gov_axes.csv ${AS_OF_DATE:+--date "$AS_OF_DATE"}
          fi

      - name: Compute shadow scores and rankings
        run: python -m bridge_pipeline.run score ${AS_OF_DATE:+--date "$AS_OF_DATE"}

      - name: Verify V5 entity-axis-date lineage
        run: python -m bridge_pipeline.audit_v5 ${AS_OF_DATE:+--date "$AS_OF_DATE"}

      - name: Publish CPR, ENT, GOV and UNI T100 beta snapshot
        run: python -m bridge_pipeline.run publish-daily ${AS_OF_DATE:+--date "$AS_OF_DATE"}

      - name: Export published snapshot
        run: python -m bridge_pipeline.run export ${AS_OF_DATE:+--date "$AS_OF_DATE"}

      - name: Pipeline health gate
        run: python -m bridge_pipeline.run healthcheck

      - name: Rebuild static site
        run: |
          python build.py
          # Apply durable page copy before SPA assembly so routed pages and
          # standalone HTML share the same approved public language.
          python tools/apply_brand_shell.py
          python build_spa.py
          # Reapply shell-only replacements to the assembled artifact.
          python tools/apply_brand_shell.py

      - name: Commit reproducible public export
        run: |
          # Never merge independently generated JSON snapshots across runs.
          # A newer source/data commit makes this run stale; the queued run wins.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Skip stale export: a newer production commit exists"
            exit 0
          fi
          git config user.name "bridge-bot"
          git config user.email "bot@bridgebrand.co.kr"
          git add site/data/latest.json site/data/uni_latest.json site/data/uni_weekly.json data/pipeline_status.json data/audit data/daily data/weekly data/latest/uni_latest.json data/gov_youtube config/gov_youtube_channels.json site/
          git diff --cached --quiet && exit 0
          # Generated exports must not trigger another full collection run.
          git commit -m "data: daily BRIDGE refresh $(date +%F) [bridge-data]"
          # build scripts may touch reproducible working files outside the public export.
          # Discard those ephemeral changes so rebase is never blocked by a dirty runner.
          git restore --worktree .
          # During a rebase, "theirs" is the pipeline commit being replayed. Prefer the
          # newest deterministic export if another run updated the same generated files.
          git push origin HEAD:main

      - name: Trigger Cloudflare deployment hook
        if: ${{ success() && env.CLOUDFLARE_DEPLOY_HOOK != '' }}
        run: curl --fail --silent --show-error --retry 3 -X POST "$CLOUDFLARE_DEPLOY_HOOK"
