name: BRIDGE editorial interpretation v2.1 isolated release QA
on:
  push:
    branches: ['feature/bridge-editorial-interpretation-v21-20261122']
permissions:
  contents: read
jobs:
  source-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and check editorial invariants
        run: |
          node --check site/briefing.js
          node --check tools/verify_editorial_interpretation_v21.mjs
          python -m unittest discover -s tests -p 'test_editorial_interpretation_v21.py' -v
          python -m unittest discover -s tests -p 'test_v2_refinement.py' -v
      - name: Inspect real RIIZE / ENHYPEN / ZEROBASEONE 02–04 screens in Chrome
        run: |
          python -m http.server 8742 --directory site >/tmp/bridge-editorial-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 25); do if curl -fsS http://127.0.0.1:8742/briefing.html >/dev/null; then break; fi; sleep 1; done
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export BRIDGE_AUDIT_ORIGIN=http://127.0.0.1:8742/
          export BRIDGE_QA_OUTPUT=/tmp/bridge-editorial-v21
          node tools/verify_editorial_interpretation_v21.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-editorial-v21-stage02-03-04
          path: /tmp/bridge-editorial-v21/*.png
          retention-days: 7
          if-no-files-found: ignore
  pdf-report:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render and download actual STANDARD and BASIC PDFs
        run: |
          python -m http.server 8742 --directory site >/tmp/bridge-editorial-pdf.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 25); do if curl -fsS http://127.0.0.1:8742/briefing.html >/dev/null; then break; fi; sleep 1; done
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export BRIDGE_AUDIT_ORIGIN=http://127.0.0.1:8742/
          export BRIDGE_QA_OUTPUT=/tmp/bridge-editorial-standard
          node tools/verify_nextgen_pdf_local.mjs
          BRIDGE_PDF_MODE=basic BRIDGE_QA_OUTPUT=/tmp/bridge-editorial-basic node tools/verify_nextgen_pdf_local.mjs
      - name: Inspect true PDF count and A4 media size
        run: |
          python -m pip install --quiet 'pypdf>=6,<7'
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          for typ,pages in [('standard',33),('basic',18)]:
              pdfs=list(Path('/tmp/bridge-editorial-'+typ).glob('*.pdf'))
              assert len(pdfs)==1,pdfs
              r=PdfReader(pdfs[0])
              assert len(r.pages)==pages,(typ,len(r.pages))
              assert all(abs(float(p.mediabox.width)-595.28)<3 and abs(float(p.mediabox.height)-841.89)<3 for p in r.pages)
              print('PASS',typ,pages,'A4 pages',pdfs[0].stat().st_size,'bytes')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-editorial-v21-actual-pdfs
          path: |
            /tmp/bridge-editorial-standard/*.pdf
            /tmp/bridge-editorial-basic/*.pdf
          retention-days: 7
          if-no-files-found: ignore
