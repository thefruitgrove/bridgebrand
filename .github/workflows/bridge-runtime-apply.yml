name: Apply BRIDGE production runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bridge-runtime.bundle.b64'
      - '.github/workflows/bridge-runtime-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified runtime snapshot
        run: |
          git config user.name "bridge-bot"
          git config user.email "bot@bridgebrand.co.kr"
          base64 --decode .github/workflows/bridge-runtime.bundle.b64 > /tmp/bridge-runtime.bundle
          git fetch /tmp/bridge-runtime.bundle deploy-squash:refs/remotes/bundle/bridge-runtime
          git cherry-pick refs/remotes/bundle/bridge-runtime
          git rm .github/workflows/bridge-runtime.bundle.b64 .github/workflows/bridge-runtime-apply.yml
          git commit -m "chore: remove one-time BRIDGE runtime carrier"
          git push origin HEAD:main
