name: BRIDGE editorial v2.1 verified production release QA
on:
  push:
    branches: ['verify/bridge-editorial-v21-live-20261122']
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for Cloudflare HTML CSS and JS to match editorial v2.1
        run: |
          python - <<'PY'
          import time,urllib.request
          targets={
            'briefing.html': ['briefing.js?v=20261122-editorial-v21','bridge-v2-final-polish.css?v=20261122-editorial-v21','bridge-v2-report-edition.css?v=20261122-editorial-pdf-v21'],
            'briefing.js': ['function kTopic(name)', 'fieldPulseStory=lines;', '새로운 결합점수를 산출하기보다는'],
            'bridge-v2-final-polish.css':['.position-row-mypick','.mypick-marker','#pickAnalysisCopy blockquote'],
            'bridge-v2-report-edition.css':['Editorial v2.1 fixed-A4 fit','print-sheet[data-page="22"]']
          }
          for attempt in range(1,31):
            mismatch=[]
            for path,tokens in targets.items():
              try:
                req=urllib.request.Request('https://bridgebrand.co.kr/'+path+'?v21-verify='+str(attempt),headers={'Cache-Control':'no-cache','User-Agent':'BRIDGE-Editorial-Real-Release-QA'})
                with urllib.request.urlopen(req,timeout=20) as r: content=r.read().decode('utf-8','replace')
                mismatch.extend(path+' missing '+t for t in tokens if t not in content)
              except Exception as e:mismatch.append(path+' ERROR '+str(e))
            print('EDGE',attempt,'PASS' if not mismatch else mismatch,flush=True)
            if not mismatch:
              print('PASS all 4 released assets synchronized')
              break
            if attempt==30:raise SystemExit('Production assets did not synchronize: '+repr(mismatch))
            time.sleep(8)
          PY
      - name: Real production ENT subject browser QA five viewport sizes
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export BRIDGE_AUDIT_ORIGIN=https://bridgebrand.co.kr/
          export BRIDGE_QA_OUTPUT=/tmp/bridge-editorial-v21-live
          node tools/verify_editorial_interpretation_v21.mjs
      - name: Download authentic live STANDARD 33-page PDF
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export BRIDGE_AUDIT_ORIGIN=https://bridgebrand.co.kr/
          export BRIDGE_QA_OUTPUT=/tmp/bridge-editorial-pdf-live
          node tools/verify_nextgen_pdf_local.mjs
      - name: Verify live JSON unaltered from GitHub and authentic A4 PDF
        run: |
          python -m pip install --quiet 'pypdf>=6,<7'
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          files=list(Path('/tmp/bridge-editorial-pdf-live').glob('*.pdf'))
          assert len(files)==1,files
          pdf=PdfReader(files[0])
          assert len(pdf.pages)==33,len(pdf.pages)
          print('PASS live STANDARD PDF',len(pdf.pages),'A4 pages and',files[0].stat().st_size,'bytes')
          PY
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const original=JSON.parse(fs.readFileSync('site/data/latest.json','utf8'));
          const response=await fetch('https://bridgebrand.co.kr/data/latest.json?verify-v21',{headers:{'User-Agent':'Mozilla/5.0'},signal:AbortSignal.timeout(25000)});
          if(!response.ok)throw Error('Public snapshot HTTP '+response.status);
          const live=await response.json();
          for(const field of ['asOfDate','dataStatus','recordCount','snapshotId']){
            if(live[field]!==original[field])throw Error('Cloudflare/GitHub mismatch '+field);
          }
          if(live.recordCount!==400||live.rankings?.length!==400)throw Error('T100 count changed');
          console.log('PASS unchanged authoritative T100 400, asOfDate '+live.asOfDate+', snapshotId '+live.snapshotId);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-editorial-v21-production-chrome-and-pdf
          path: |
            /tmp/bridge-editorial-v21-live/*.png
            /tmp/bridge-editorial-pdf-live/*.pdf
          retention-days: 7
          if-no-files-found: ignore
