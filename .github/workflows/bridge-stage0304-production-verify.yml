name: BRIDGE 03-04 live browser QA
on:
  push:
    branches: ['verify/bridge-stage0304-live-20261115']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production Stage 03/04 with real browser
        run: |
          command -v google-chrome || true
          command -v chromium || true
          command -v chromium-browser || true
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then echo 'No Chrome binary in this runner image'; exit 1; fi
          export CHROME_BIN
          "$CHROME_BIN" --version
          node --check tools/verify_briefing_stage0304_live.mjs
          node tools/verify_briefing_stage0304_live.mjs
      - name: Save mobile and desktop stage screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-stage0304-desktop-mobile
          path: /tmp/bridge-stage0304/*.png
          if-no-files-found: ignore
          retention-days: 14
