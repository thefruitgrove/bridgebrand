name: Apply verified BRIDGE update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bridge-update.bundle.b64'
      - '.github/workflows/bridge-apply-update.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified local commit
        run: |
          git config user.name "bridge-bot"
          git config user.email "bot@bridgebrand.co.kr"
          base64 --decode .github/workflows/bridge-update.bundle.b64 > /tmp/bridge-update.bundle
          git fetch /tmp/bridge-update.bundle refs/heads/bridge-update:refs/remotes/bundle/bridge-update
          git cherry-pick refs/remotes/bundle/bridge-update
          git rm .github/workflows/bridge-update.bundle.b64 .github/workflows/bridge-apply-update.yml
          git commit -m "chore: remove one-time update carrier"
          git push origin HEAD:main
