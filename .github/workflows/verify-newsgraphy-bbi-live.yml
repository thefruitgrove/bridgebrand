name: Verify Newsgraphy BBI real browser snapshot
on:
  push:
    branches: ['verify/newsgraphy-bbi-widget-20261117']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public Newsgraphy homepage widget with Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          node --check tools/verify_newsgraphy_bbi_widget.mjs
          node tools/verify_newsgraphy_bbi_widget.mjs
      - name: Preserve public homepage screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newsgraphy-bbi-live-screenshot
          path: /tmp/newsgraphy-bbi-check/*.png
          if-no-files-found: ignore
