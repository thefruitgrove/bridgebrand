name: BRIDGE live cover and PDF release verification
on:
  push:
    branches: ['verify/bridge-cover-live-20261122']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Cloudflare production assets updated
        run: |
          python - <<'PY'
          import urllib.request,time
          root='https://bridgebrand.co.kr/'
          expected={
            'briefing.html':['briefing.js?v=20261122-coverfix-01','bridge-v2-final-polish.css?v=20261122-coverfix-01'],
            'briefing.js':["box.classList.add('briefing-cover-notice-mode')","link.href='intelligence.html'"],
            'bridge-v2-final-polish.css':['.briefing-cover-stats.briefing-cover-notice-mode','.briefing-cover-notice strong']
          }
          for attempt in range(1,25):
            errors=[]
            for path,tokens in expected.items():
              try:
                req=urllib.request.Request(root+path+'?cover-release-check='+str(attempt),headers={'Cache-Control':'no-cache','User-Agent':'BRIDGE-Real-Production-QA'})
                with urllib.request.urlopen(req,timeout=15) as response:content=response.read().decode('utf-8','replace')
                errors.extend([path+' missing '+token for token in tokens if token not in content])
              except Exception as exc:errors.append(path+': '+str(exc))
            print('EDGE',attempt,'PASS' if not errors else errors,flush=True)
            if not errors:
              print('PASS live HTML, JS, stylesheet and cache key are synchronized')
              break
            if attempt==24:raise SystemExit('FAIL: assets not available on Cloudflare')
            time.sleep(10)
          PY
      - name: Verify all five live responsive widths with real Chrome
        run: |
          export BRIDGE_AUDIT_ORIGIN=https://bridgebrand.co.kr/
          export BRIDGE_QA_OUTPUT=/tmp/bridge-cover-production
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node tools/verify_briefing_cover_notice.mjs
      - name: Verify published T100 snapshot date and complete rows
        run: |
          python - <<'PY'
          import json,urllib.request
          with urllib.request.urlopen('https://bridgebrand.co.kr/data/latest.json',timeout=25) as response:data=json.load(response)
          assert data.get('asOfDate')=='2026-11-22',data.get('asOfDate')
          assert data.get('dataStatus')=='published',data.get('dataStatus')
          assert data.get('recordCount')==400,data.get('recordCount')
          assert len(data.get('rankings',[]))==400
          print('PASS 2026-11-22 real public T100 400; snapshotId='+str(data.get('snapshotId')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-production-cover-desktop-mobile
          path: /tmp/bridge-cover-production/*.png
          retention-days: 7
          if-no-files-found: ignore
