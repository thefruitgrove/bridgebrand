name: BRIDGE PUBLICITY Scheduled Editorial

on:
  schedule:
    - cron: '30 1 * * 1,3,5' # 10:30 KST prepare
    - cron: '15,45 2 * * 1,3,5' # 11:15 and 11:45 KST recovery
    - cron: '10,40 3 * * 1,3,5' # delayed-input recovery; disclosed as delayed
  workflow_dispatch:
    inputs:
      publication_date:
        description: 'KST publication date YYYY-MM-DD (blank: today)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'publicity/**'
      - 'tests/test_publicity.py'
      - 'tools/verify_publicity.py'
      - 'tools/verify_publicity_schedule.py'
      - '.github/workflows/bridge-publicity.yml'

permissions:
  contents: read

concurrency:
  group: bridge-publicity-editorial
  cancel-in-progress: false

jobs:
  validate-and-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Asia/Seoul
      SUPABASE_URL: https://gorlbfqvyxtdsxgoqinf.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PUBLICATION_DATE: ${{ inputs.publication_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Editorial contract tests
        run: python -m unittest discover -s tests -p test_publicity.py -v
      - name: Preflight anonymous PUBLICITY access
        # A recovery run must be allowed to create a missing due edition first.
        # The strict due-edition assertion remains in the final anonymous check.
        run: python tools/verify_publicity.py --preflight
      # Do not rebuild the full September-to-date archive here. The daily pipeline
      # owns and commits site/data/history.json. PUBLICITY is a lightweight consumer:
      # scheduled recovery runs simply retry after the daily data commit lands.
      # Re-exporting tens of thousands of axis rows here previously exhausted the
      # editorial job's time budget before article staging.
      - name: Prepare the due edition atomically
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[publicity-recovery]') }}
        run: python -m publicity.generate ${PUBLICATION_DATE:+--date "$PUBLICATION_DATE"}
      - name: Validate the due edition is prepared
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[publicity-recovery]') }}
        run: python tools/verify_publicity_schedule.py
      - name: Validate published article access
        run: python tools/verify_publicity.py
      - name: Publication summary
        if: always()
        run: |
          echo '### PUBLICITY editorial' >> "$GITHUB_STEP_SUMMARY"
          echo 'Preparation uses a frozen allowlisted public snapshot. The database releases ready articles at 12:00 Asia/Seoul. Monday OVERALL uses the latest verified date shared by all four domains inside the completed week; Wednesday and Friday require their exact observation date. Anonymous publication access is checked before and after preparation. The due edition ID, ready status and prepared timestamp are verified with service access before the run can succeed.' >> "$GITHUB_STEP_SUMMARY"
