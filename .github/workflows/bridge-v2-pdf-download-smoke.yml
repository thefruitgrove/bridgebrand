name: BRIDGEBRAND 2.0 Real PDF Download Smoke Test
# One-time deployment check. No Cron or data collection, no index changes.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bridge-v2-pdf-download-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify PDF generator and current published report engine
        run: |
          node --check tools/verify_v2_pdf_download.mjs
          python - <<'PY'
          import urllib.request
          base='https://bridgebrand.co.kr/'
          for path,fragment in {
            'briefing.html':'id="savePdf"',
            'briefing.js':'downloadReportPdf',
            'html2canvas.min.js':'html2canvas',
            'jspdf.umd.min.js':'jsPDF',
          }.items():
            req=urllib.request.Request(base+path,headers={'User-Agent':'BRIDGE-Real-PDF-QA'})
            with urllib.request.urlopen(req,timeout=18) as r:
              content=r.read().decode('utf-8','replace')
            if fragment not in content:raise SystemExit('PDF engine prerequisite missing '+path)
          print('Current live report assets verified')
          PY
      - name: Download actual 6-stage STANDARD PDF in headless Chrome
        run: node tools/verify_v2_pdf_download.mjs
      - name: Validate PDF document and A4 page count
        run: |
          python -m pip install --quiet 'pypdf>=6,<7'
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          files=list(Path('/tmp/bridge-pdf-qa').glob('*.pdf'))
          assert len(files)==1,files
          reader=PdfReader(str(files[0]))
          pages=len(reader.pages)
          assert pages>=17, f'Unexpected PDF page count: {pages}'
          assert all(float(p.mediabox.width)>500 and float(p.mediabox.height)>700 for p in reader.pages)
          print(f'PASS: authentic downloaded PDF, {pages} A4 pages, {files[0].stat().st_size} bytes')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridgebrand-real-report-pdf-qa
          path: |
            /tmp/bridge-pdf-qa/*.pdf
            /tmp/bridge-pdf-qa/*.png
          retention-days: 3
          if-no-files-found: ignore
