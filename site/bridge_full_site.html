<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRIDGE â€” Reputation is a signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14181f;
  --navy:#17233F;
  --navy-deep:#0F1522;
  --paper:#FAF8F3;
  --paper-2:#F1EEE6;
  --line:rgba(20,24,31,0.14);
  --rise:#3f8a5c;
  --risk:#b8564f;
  --gold:#a9884f;
  --serif: 'Noto Serif KR', Georgia, 'Times New Roman', 'Nanum Myeongjo', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Pretendard', Arial, sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--sans); color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; background:none; border:none; cursor:pointer; color:inherit;}
.wrap{max-width:1280px; margin:0 auto; padding:0 40px;}
ul{list-style:none;}

/* ---------------- TICKER ---------------- */
.ticker{ position:sticky; top:0; z-index:50; display:flex; align-items:stretch; background:var(--navy-deep); color:#fff; height:38px; border-bottom:1px solid rgba(255,255,255,.12);}
.ticker-toggle{ flex:0 0 auto; padding:0 16px; font-size:11px; font-weight:700; letter-spacing:.08em; border-right:1px solid rgba(255,255,255,.14);}
.ticker-viewport{ flex:1; overflow:hidden; position:relative;}
.ticker-track{ display:flex; align-items:center; height:38px; white-space:nowrap; width:max-content; animation:tickerScroll 2600s linear infinite;}
.ticker-track.paused{ animation-play-state:paused;}
@keyframes tickerScroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
.ticker-track span{ display:inline-flex; align-items:baseline; gap:6px; padding:0 18px; font-size:12px; border-right:1px solid rgba(255,255,255,.1);}
.ticker-track b{ color:#b9c3dd; font-weight:700; font-size:10.5px; letter-spacing:.04em;}
.t-up{ color:#7fd39a;} .t-down{ color:#e59a94;} .t-flat{ color:#9aa2b5;} .t-score{ color:#d4b06a; font-weight:700;}

/* THIS WEEK digest cards */
.tw-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:16px; margin-top:24px;}
.tw-card{ display:block; background:#fff; border:1px solid #e4dfd0; border-radius:8px; padding:16px; text-decoration:none; color:inherit; transition:box-shadow .15s, transform .15s;}
.tw-card:hover{ box-shadow:0 4px 16px rgba(0,0,0,.08); transform:translateY(-2px);}
.tw-card-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.tw-domain{ font-size:10.5px; font-weight:700; letter-spacing:.05em; padding:2px 8px; border-radius:4px; color:#fff;}
.tw-domain-cpr{ background:#8B7355;} .tw-domain-gov{ background:#4A6572;} .tw-domain-uni{ background:#6B5B95;} .tw-domain-ent{ background:#B85C56;}
.tw-date{ font-size:11px; color:#8B8779;}
.tw-name{ font-size:16px; font-weight:700; margin-bottom:6px; color:#1A1A1A;}
.tw-headline{ font-size:12.5px; color:#4A4A4A; line-height:1.4; margin-bottom:12px; min-height:34px;}
.tw-bottom{ display:flex; gap:10px; align-items:center; font-size:11.5px; color:#8B8779; border-top:1px solid #EEEAE0; padding-top:8px;}
.tw-score{ font-weight:700; color:#A9884F; font-size:14px;}

/* ---------------- NAV ---------------- */
.nav{ position:sticky; top:38px; z-index:49; background:var(--paper); border-bottom:1px solid var(--line);}
.nav-inner{ max-width:1280px; margin:0 auto; padding:16px 40px; display:flex; align-items:center; justify-content:space-between;}
.logo{ font-family:var(--serif); font-size:19px; font-weight:700; display:flex; align-items:baseline; gap:8px;}
.logo .op{ font-size:9px; letter-spacing:.16em; color:#8b8779; font-weight:700;}
.nav-menu{ display:flex; align-items:center; gap:30px;}
.nav-item{ position:relative;}
.nav-item > a{ font-size:12.5px; font-weight:600; letter-spacing:.04em; color:#565248; padding:6px 0; border-bottom:2px solid transparent;}
.nav-item > a.active, .nav-item:hover > a{ color:var(--ink); border-bottom-color:var(--ink);}
.nav-drop{
  position:absolute; top:calc(100% + 12px); left:0; min-width:200px;
  background:#fff; border:1px solid var(--line); box-shadow:0 16px 34px rgba(20,24,31,.12);
  padding:8px 0; opacity:0; pointer-events:none; transform:translateY(-6px);
  transition:opacity .16s ease, transform .16s ease; z-index:60;
}
.nav-item.has-drop:hover .nav-drop, .nav-item.has-drop.open .nav-drop{ opacity:1; pointer-events:auto; transform:translateY(0);}
.nav-drop a{ display:block; padding:9px 18px; font-size:12px; color:#565248;}
.nav-drop a:hover{ background:var(--paper-2); color:var(--ink);}
.nav-right{ display:flex; align-items:center; gap:20px;}
.nav-util{ font-size:11.5px; font-weight:600; color:#8b8779;}
.nav-util:hover{ color:var(--ink);}
.nav-toggle{ display:none; font-size:20px;}

.mobile-menu{
  position:fixed; inset:0; background:var(--paper); z-index:200; padding:24px;
  transform:translateX(100%); transition:transform .25s ease; display:flex; flex-direction:column;
}
.mobile-menu.open{ transform:translateX(0);}
.mobile-menu-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;}
.mm-close{ font-size:26px;}
.mobile-menu a{ font-size:18px; font-weight:600; padding:14px 0; border-bottom:1px solid var(--line);}
.mobile-menu a.mm-util{ font-size:13px; color:#8b8779; border-bottom:none;}

/* ---------------- HERO ---------------- */
.hero{ padding:64px 0 40px;}
.hero-grid{ display:grid; grid-template-columns:1.3fr .7fr; gap:60px; align-items:end;}
.hero-eyebrow{ font-size:11.5px; letter-spacing:.04em; color:#8b8779; margin-bottom:22px; line-height:1.7;}
.hero h1{ font-family:var(--serif); font-size:clamp(34px,4.6vw,58px); line-height:1.12; margin-bottom:20px;}
.lead{ font-size:15px; line-height:1.8; color:#3d3a33; max-width:52ch; margin-bottom:26px;}
.hero-cta{ display:flex; gap:18px; flex-wrap:wrap;}
.btn-primary{ background:var(--ink); color:var(--paper); padding:13px 22px; font-size:12.5px; font-weight:700; letter-spacing:.03em;}
.btn-ghost{ padding:13px 4px; font-size:12.5px; font-weight:700; border-bottom:1px solid var(--ink);}
.hero-figure{ text-align:right;}
.hero-num{ font-family:var(--serif); font-size:64px; line-height:1;}
.hero-num sup{ font-size:14px; vertical-align:super; margin-left:6px;}
.hero-num-cap{ font-size:11.5px; color:#8b8779; margin-top:10px;}
.hero-rule{ height:1px; background:var(--ink); margin-top:44px;}

/* ---------------- SECTIONS ---------------- */
.section{ padding:64px 0;}
.section.tint{ background:var(--paper-2);}
.section-head{ margin-bottom:34px; max-width:640px;}
.section-head h2{ font-family:var(--serif); font-size:clamp(26px,3vw,36px); margin-bottom:10px;}
.section-head p{ font-size:13.5px; color:#5a564d; line-height:1.7;}

.idx-grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line);}
.idx-col{ background:var(--paper); padding:26px;}
.idx-col h3{ font-size:11.5px; letter-spacing:.1em; font-weight:700; color:#8b8779; margin-bottom:16px;}
.idx-mini{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
.idx-mini .sc{ font-family:var(--serif);}
.idx-more{ display:inline-block; margin-top:16px; font-size:11.5px; font-weight:700; border-bottom:1px solid var(--ink);}

.axis-list{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
.axis-list li{ display:flex; gap:14px; align-items:flex-start; padding:18px; background:#fff; border:1px solid var(--line);}
.axis-letter{ font-family:var(--serif); font-size:26px; color:var(--navy); flex:0 0 auto;}
.axis-name{ font-weight:700; font-size:13.5px;}
.axis-q{ font-size:12px; color:#8b8779; margin-top:3px;}

.make-list li{ display:flex; gap:14px; align-items:flex-start; padding:14px 0; border-bottom:1px solid var(--line); font-size:14px; line-height:1.7;}
.make-list .o{ font-family:var(--serif); font-weight:700; color:var(--navy); flex:0 0 22px;}

/* ---------------- ORIGINAL SOURCE BLOCK (verbatim from preview.html) ---------------- */
/* weekly signal cards */
.weekly{ display:grid; grid-template-columns:1.1fr 1fr; gap:1px; background:var(--line);}
.lead-card{ background:#fff; padding:32px; display:flex; flex-direction:column; justify-content:space-between; gap:26px;}
.lead-card .tag{ font-size:11px; letter-spacing:.1em; font-weight:700; color:#8b8779; margin-bottom:14px;}
.lead-card .name{ font-family:var(--serif); font-size:26px; margin-bottom:12px;}
.lead-card .score-row{ display:flex; align-items:baseline; gap:12px; margin-bottom:16px;}
.lead-card .score{ font-family:var(--serif); font-size:42px;}
.delta{ font-size:14px; font-weight:700;}
.rise-text{ color:var(--rise);} .risk-text{ color:var(--risk);}
.lead-card .diag{ font-size:13px; line-height:1.75; color:#5a564d;}
.lead-card .grade{ font-size:11.5px; color:#8b8779; border-top:1px solid var(--line); padding-top:16px;}
.briefs{ background:#fff; display:flex; flex-direction:column; gap:1px;}
.brief{ background:#fff; padding:24px 32px; border-bottom:1px solid var(--line);}
.brief:last-child{ border-bottom:none;}
.brief .tag{ font-size:10.5px; letter-spacing:.1em; font-weight:700; color:#8b8779; margin-bottom:10px;}
.brief-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; gap:12px;}
.brief-row .name{ font-size:15px; font-weight:600;}
.brief-row .num{ font-family:var(--serif); font-size:16px; white-space:nowrap;}
.brief .diag{ font-size:12.5px; line-height:1.7; color:#5a564d;}

/* eband â€” full-bleed dark scene */
.eband{ position:relative; display:flex; align-items:flex-end; overflow:hidden; color:#fff;}
.eband svg{ position:absolute; inset:0; width:100%; height:100%;}
.eband-cap{ position:relative; z-index:2; padding:60px; max-width:640px;}
.eband-cap .num{ font-size:11px; letter-spacing:.12em; color:#b9c3dd; font-weight:700; margin-bottom:16px;}
.eband-cap h1{ font-family:var(--serif); font-size:clamp(30px,4vw,46px); line-height:1.15; margin-bottom:16px;}
.eband-cap p{ font-size:14px; line-height:1.75; color:#d6dbe8;}

/* axis-block: radar diagram beside the six-axis list (THIS WEEK page only) */
.axis-block{ display:grid; grid-template-columns:1fr 300px; gap:60px; align-items:center;}
.axis-block .axis-list{ display:flex; flex-direction:column; gap:0; grid-template-columns:none;}
.axis-block .axis-list li{ display:flex; gap:16px; align-items:baseline; padding:14px 0; border-bottom:1px solid var(--line); background:transparent; border-left:none; border-right:none; border-top:none;}
.axis-block .axis-letter{ font-size:22px;}
.axis-block .axis-name{ font-size:13.5px;}

/* ---------------- mstrip: colored index-identity bar (real CPR source) ---------------- */
.mstrip{ padding:13px 0; color:#fff; font-size:12px; letter-spacing:.03em;}
.mstrip .wrap{ display:flex; justify-content:space-between; align-items:center;}
.mstrip a{ font-weight:700; border-bottom:1px solid rgba(255,255,255,.5); padding-bottom:2px;}
.mstrip.cpr{ background:#3B4A63;}
.mstrip.star{ background:#4A3550;}
.mstrip.gov{ background:#2E4E47;}

/* ---------------- rank list (real CPR source: rank/rank-row/...) ---------------- */
.rank{ display:flex; flex-direction:column; list-style:none;}
.rank.rk-panel.hidden{ display:none;}
.rank-row{ display:flex; align-items:center; gap:20px; padding:20px 4px; border-bottom:1px solid var(--line);}
.rank-row:hover{ background:rgba(20,24,31,.03);}
.rank-row.top3 .rank-rank{ color:var(--gold); font-weight:700;}
.rank-rank{ font-family:var(--serif); font-size:20px; flex:0 0 36px;}
.rank-name{ flex:1; display:flex; flex-direction:column; gap:4px; min-width:0;}
.rank-name b{ font-size:14.5px; font-weight:600;}
.rank-name span{ font-size:11px; color:#8b8779; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rank-score{ font-family:var(--serif); font-size:19px; flex:0 0 auto; min-width:56px; text-align:right;}
.rank-delta{ font-size:12px; font-weight:700; flex:0 0 auto; min-width:60px; text-align:right;}
.watch-text{ color:#9a968a;}
.pullquote{ font-family:var(--serif); font-style:italic; font-size:18px; line-height:1.65; max-width:640px; border-left:2px solid var(--navy); padding-left:22px; color:#3d3a33;}

/* ---------------- PILOT page ---------------- */
.pilot-notice{ background:transparent; border:none; padding:0; margin:0 0 40px; font-size:13.5px; line-height:1.8; color:#4a3f1f; max-width:1200px;}
.model-title{ font-family:var(--serif); font-size:16px; font-weight:700; color:#3a2f14; margin-bottom:12px;}
.model-explain{ background:#fff8e6; border:1px solid #e0c98a; border-radius:6px; padding:18px 22px; margin-bottom:12px; color:#4a3f1f;}
.model-source{ font-size:12px; color:#8B8779; line-height:1.6; padding:0 2px;}
.pilot-block{ margin-bottom:56px;}
.pilot-block h2{ font-family:var(--serif); font-size:24px; margin-bottom:8px;}
.trust-badge{ width:34px; height:34px; border-radius:50%; border:1px solid var(--ink); display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:700;}

/* ---------------- Period selector (Week/Month/Quarter/Half/Year) ---------------- */
.period-selector{ border:1px solid var(--ink); padding:18px 22px; margin-bottom:28px; background:#fff;}
.period-row{ display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.period-unit-tabs{ display:flex; border:1px solid var(--ink);}
.period-unit{ padding:8px 14px; font-size:11.5px; font-weight:700; letter-spacing:.03em; border-right:1px solid var(--ink); background:#fff; color:var(--ink);}
.period-unit:last-child{ border-right:none;}
.period-unit.active{ background:var(--ink); color:var(--paper);}
.period-range{ font-family:var(--sans); font-size:12.5px; padding:8px 10px; border:1px solid var(--line); background:#fff; min-width:220px;}
.period-status{ font-family:var(--serif); font-size:15px; font-weight:700; color:#9a968a; margin-left:auto;}
.period-note{ font-size:11px; color:#8b8779; line-height:1.7; margin-top:12px;}

/* ---------------- Format example toggle ---------------- */
.example-toggle-row{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:18px;}
.format-toggle{ border:1px solid var(--ink); padding:9px 16px; font-size:11.5px; font-weight:700; letter-spacing:.03em; background:#fff;}
.format-toggle.active{ background:var(--ink); color:var(--paper);}
.format-toggle-note{ font-size:11px; color:#8b8779;}
.rk-row.example-mode .rk-score, .rk-row.example-mode .rk-wow, .rk-row.example-mode .rk-dims, .rk-row.example-mode .trust-badge{ color:#9a7a2e;}
.rk-row.example-mode .trust-badge{ border-color:#9a7a2e;}
.example-tag{ font-size:9px; color:#9a7a2e; font-weight:700; margin-left:3px;}

/* ---------------- ì‹¤ì¸¡ íŒŒì¼ëŸ¿ (real, evidence-based â€” distinct from N/R and ì˜ˆì‹œ) ---------------- */
.rk-row.rk-realpilot{ background:rgba(46,125,90,.06); border-left:3px solid #2e7d5a;}
.realpilot-tag{ display:inline-block; font-size:9px; font-weight:700; color:#fff; background:#2e7d5a; padding:2px 6px; margin-left:6px; border-radius:2px; vertical-align:middle;}
.trust-badge.grade-C{ background:#2e7d5a; color:#fff; border-color:#2e7d5a;}
.evidence-list{ margin-top:20px; padding-top:16px; border-top:1px solid var(--line);}
.evidence-list h4{ font-size:12px; font-weight:700; margin-bottom:10px; color:#2e7d5a;}
.evidence-item{ font-size:11.5px; line-height:1.6; margin-bottom:8px; padding-left:14px; border-left:2px solid #2e7d5a;}
.evidence-item a{ color:#2e7d5a; text-decoration:underline;}
.limitation-list{ margin-top:16px; font-size:11px; color:#8b8779; line-height:1.7;}
.limitation-list li{ margin-left:16px; list-style:disc;}
@media (max-width:700px){
  .period-row{ flex-direction:column; align-items:stretch;}
  .period-status{ margin-left:0;}
}

/* ---------------- BRIDGE sample diagram modal (UNI demo) ---------------- */
.rk-clickable{ cursor:pointer; }
.rk-clickable:hover{ background:rgba(169,136,79,.08); }
.bridge-modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(10,10,12,.72); z-index:500;
  align-items:center; justify-content:center; padding:20px;
}
.bridge-modal-overlay.open{ display:flex; }
.bridge-modal{
  background:var(--paper); max-width:760px; width:100%; max-height:90vh; overflow-y:auto;
  padding:36px; position:relative; border:1px solid var(--line);
}
.bridge-modal-close{ position:absolute; top:16px; right:20px; font-size:26px; line-height:1; color:var(--ink);}
.bridge-modal-flag{
  background:#fff3cd; border:1px solid #e0c98a; color:#4a3f1f; font-size:12px; font-weight:700;
  padding:10px 14px; margin-bottom:20px; text-align:center;
}
.bridge-modal-title{ font-family:var(--serif); font-size:30px; margin-bottom:6px;}
.bridge-modal-sub{ font-size:12.5px; color:#8b8779; margin-bottom:24px;}
.bridge-modal-body{ display:grid; grid-template-columns:280px 1fr; gap:28px; align-items:start;}
.bridge-radar{ width:100%; height:auto;}
.bridge-modal-table{ font-size:12.5px;}
.bridge-modal-score{ margin-top:24px; border-top:1px solid var(--line); padding-top:18px; display:flex; flex-direction:column; gap:10px;}
.bmscore-row{ display:flex; justify-content:space-between; align-items:baseline; font-size:13px;}
.bmscore-label{ font-weight:700; letter-spacing:.03em;}
.bmscore-sub{ font-weight:400; font-size:11px; color:#8b8779; margin-left:4px;}
.bmscore-value{ font-family:var(--serif); font-size:22px; color:#9a968a;}
.bmscore-wow{ font-family:var(--sans); font-size:14px; font-weight:700;}
.bmscore-note{ font-size:11px; color:#8b8779; line-height:1.6; margin-top:4px;}
@media (max-width:700px){
  .bridge-modal-body{ grid-template-columns:1fr; }
}

/* ---------------- lookbook (real STAR source: STAR-P photo cards) ---------------- */
.lookbook{ display:grid; grid-template-columns:repeat(4,1fr); gap:22px;}
.look-item{ display:flex; flex-direction:column;}
.look-art{ aspect-ratio:4/5; overflow:hidden; background:#eee;}
.look-art svg{ width:100%; height:100%; display:block;}
.look-meta{ padding:14px 2px;}
.look-meta .name{ font-family:var(--serif); font-size:17px; margin-bottom:6px;}
.look-meta .row{ display:flex; justify-content:space-between; font-size:11.5px; color:#8b8779;}
.look-meta .row .num{ font-family:var(--serif); font-size:13px; color:var(--ink);}
.badge-mod{ display:inline-flex; align-items:center; justify-content:center; width:38px; height:22px; font-size:9.5px; font-weight:700; letter-spacing:.04em; border:1px solid var(--ink);}
.badge-mod.star{ background:#4A3550; color:#fff; border-color:#4A3550;}

@media (max-width:900px){
  .lookbook{ grid-template-columns:repeat(2,1fr);}
}

/* ---------------- methodology (real INDEX source) ---------------- */
.about-hero{ padding:64px 0 40px;}
.about-kicker{ font-size:11px; letter-spacing:.1em; font-weight:700; color:#8b8779; margin-bottom:20px;}
.about-hero h1{ font-family:var(--serif); font-size:clamp(34px,5vw,54px); line-height:1.15; margin-bottom:20px;}
.doc-grid{ display:grid; grid-template-columns:200px 1fr; gap:60px; padding:20px 0 80px; align-items:start;}
.doc-toc{ position:sticky; top:90px; display:flex; flex-direction:column; gap:4px;}
.doc-toc a{ font-size:12.5px; color:#8b8779; padding:8px 0; border-bottom:1px solid var(--line);}
.doc-toc a:hover{ color:var(--ink);}
.doc-block{ padding-bottom:44px; margin-bottom:44px; border-bottom:1px solid var(--line);}
.doc-block:last-child{ border-bottom:none;}
.doc-block h3{ font-family:var(--serif); font-size:22px; margin-bottom:16px;}
.doc-block p{ font-size:14px; line-height:1.85; color:#3d3a33; margin-bottom:16px; max-width:74ch;}
.mini-table{ width:100%; border-collapse:collapse; margin:20px 0; font-size:12.5px;}
.mini-table th, .mini-table td{ text-align:left; padding:10px 14px; border-bottom:1px solid var(--line);}
.mini-table th{ font-size:10.5px; letter-spacing:.08em; color:#8b8779; font-weight:700;}

@media (max-width:900px){
  .doc-grid{ grid-template-columns:1fr; gap:24px;}
  .doc-toc{ position:static; flex-direction:row; flex-wrap:wrap; gap:10px 16px;}
  .mini-table{ font-size:11px;}
}

@media (max-width:900px){
  .rank-row{ flex-wrap:wrap; gap:8px 16px;}
  .rank-name{ order:1; flex:1 1 100%;}
  .rank-rank{ order:0;}
  .rank-score{ order:2;}
  .rank-delta{ order:3;}
}

/* ---------------- LIST PAGES ---------------- */
.list-hero{ padding:56px 0 28px;}
.list-hero h1{ font-family:var(--serif); font-size:clamp(38px,6vw,64px); margin-bottom:14px;}
.list-note{ font-size:13px; color:#5a564d; line-height:1.75; max-width:760px;}

.seg-control{ display:flex; border:1px solid var(--ink); margin-bottom:0;}
.seg-btn{ flex:1; padding:16px 20px; font-size:12.5px; font-weight:700; letter-spacing:.04em; border-right:1px solid var(--ink); background:var(--paper); color:var(--ink); display:flex; justify-content:space-between;}
.seg-btn:last-child{ border-right:none;}
.seg-btn.active{ background:var(--ink); color:var(--paper);}
.seg-btn span{ font-family:var(--serif);}

.rk-panel.hidden{ display:none;}
.rk-head{
  display:grid; grid-template-columns: 64px 1.7fr .8fr 2fr .9fr .7fr .6fr; gap:14px;
  padding:16px 8px; border-bottom:1px solid var(--ink); font-size:10px; letter-spacing:.1em; font-weight:700; color:#8b8779;
}
.rk-row{
  display:grid; grid-template-columns: 64px 1.7fr .8fr 2fr .9fr .7fr .6fr; gap:14px;
  padding:18px 8px; border-bottom:1px solid var(--line); align-items:center;
}
.rk-row:hover{ background:rgba(20,24,31,.03);}
.rk-row.top3{ background:rgba(169,136,79,.07);}
.rk-num{ font-family:var(--serif); font-size:19px;}
.rk-row.top3 .rk-num{ color:var(--gold); font-weight:700;}
.rk-name .nm{ font-size:14.5px; font-weight:600;}
.rk-name .sub{ font-size:10.5px; color:#8b8779; margin-top:2px;}
.rk-market{ font-size:11px; color:#5a564d;}
.rk-dims{ display:flex; gap:8px; flex-wrap:wrap;}
.rk-dims .dm{ font-size:11px; color:#5a564d;}
.rk-dims .dm b{ color:var(--navy); margin-right:2px;}
.rk-score{ font-family:var(--serif); font-size:19px; display:flex; align-items:baseline; gap:6px;}
.sd{ font-size:10.5px; font-family:var(--sans);}
.sd-up{ color:var(--rise);} .sd-down{ color:var(--risk);} .sd-flat{ color:#9a968a;}
.rk-wow{ font-size:11.5px; font-weight:700;}
.wow-up{ color:var(--rise);} .wow-down{ color:var(--risk);} .wow-flat{ color:#9a968a;}
.trust-badge{ width:28px; height:28px; border-radius:50%; border:1px solid var(--ink); display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;}
.trust-badge.grade-A{ background:var(--ink); color:var(--paper);}
.trust-badge.grade-D{ opacity:.55;}

/* ---------------- FOOTER ---------------- */
footer{ background:var(--navy-deep); color:#cdd3e0; padding:50px 0 30px; margin-top:20px;}
.footer-top{ display:flex; justify-content:space-between; align-items:center; padding-bottom:24px; border-bottom:1px solid rgba(255,255,255,.14); flex-wrap:wrap; gap:16px;}
footer .logo{ color:#fff;}
footer .logo .op{ color:#7c86a0;}
.footer-links{ display:flex; gap:22px; flex-wrap:wrap;}
.footer-links a{ font-size:12px; color:#b9c0d2;}
.footer-links a:hover{ color:#fff;}
.footer-op{ font-size:11.5px; color:#8790a6; margin-top:18px;}
.footer-note{ font-size:11px; color:#6c7590; margin-top:10px; line-height:1.7; max-width:820px;}

.nav.on-dark{
  position:fixed; top:38px; left:0; right:0; background:linear-gradient(to bottom, rgba(0,0,0,.5), rgba(0,0,0,0));
  border-bottom:none; z-index:60;
}
.nav.on-dark .nav-item > a{ color:#cfccc2;}
.nav.on-dark .nav-item > a.active, .nav.on-dark .nav-item:hover > a{ color:#fff; border-bottom-color:#fff;}
.nav.on-dark .logo{ color:#fff;}
.nav.on-dark .logo .op{ color:#a9a59a;}
.nav.on-dark .nav-util{ color:#cfccc2;}
.nav.on-dark .nav-util:hover{ color:#fff;}
.nav.on-dark .nav-toggle{ color:#fff;}
.nav.on-dark .nav-drop{ background:#141317; border-color:var(--line-dark, rgba(255,255,255,.14));}
.nav.on-dark .nav-drop a{ color:#d7d4cb;}
